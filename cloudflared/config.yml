# NOTE ON THE OLD ADDRESSES — read before retiring them.
#
# safenest.raghudarshan.online and finmate.raghudarshan.online are deliberately
# NOT listed any more: the owner chose a clean cut-over to safenesthub.in on
# 16 Sep 2026, with the live licences reissued against the new address.
#
# That reissue is not optional, and the order matters. A licence carries its
# issuer inside a signed Ed25519 token and it CANNOT be rewritten — so a copy
# issued against the old address keeps calling the old address until it is
# handed a new licence. This exact mistake has already been made once here: the
# 15 Aug rename dropped finmate.raghudarshan.online from this file and a Mac
# customer on the old perpetual key hit "could not reach your supplier" on every
# update check, because the route was gone.
#
# So: reissue every live licence FIRST, confirm each copy has activated the new
# one, and only then let the old hostnames stop answering. Until that is done,
# keep the old machine serving them.
# ---------------------------------------------------------------------------
