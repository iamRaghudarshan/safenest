# the app — Cloudflare named-tunnel config.
# Fill the two <PLACEHOLDERS> after you run `cloudflared tunnel create finmate`
# (that command prints the Tunnel ID and writes the credentials JSON).
#
#   b6ea7271-4d37-414e-9899-55be7f3903c5  -> the UUID printed by `cloudflared tunnel create finmate`
#   finmate.YOURDOMAIN.com -> the public hostname you want (must be on your Cloudflare zone)

tunnel: b6ea7271-4d37-414e-9899-55be7f3903c5
credentials-file: C:\Users\Lenovo\.cloudflared\b6ea7271-4d37-414e-9899-55be7f3903c5.json

ingress:
  # All traffic for the hostname goes to the local the app app (served by
  # start-finmate-internet.ps1 on port 8080).
  - hostname: safenest.raghudarshan.online
    service: http://127.0.0.1:8080
  # The OLD hostname must keep reaching this app. Licences issued before the
  # 15 Aug rename carry `https://finmate.raghudarshan.online` as their signed
  # issuer, and that address cannot be rewritten in a signed Ed25519 token. A
  # Mac customer on the old perpetual key hit "could not reach your supplier"
  # (a 404 HTML page the updater could not parse as JSON) on the update check,
  # because this route was removed. Both hostnames now serve the same app, so
  # every stranded old-domain copy — update checks and revocation polls alike —
  # works again without reissuing. Keep this until no old-domain licence is live.
  - hostname: finmate.raghudarshan.online
    service: http://127.0.0.1:8080
  # Required catch-all.
  - service: http_status:404
