<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <!--
    One icon per module, inlined into the page rather than fetched: an external
    <use href="file.svg#id"> is not reliably allowed cross-document, and the CSP
    here is strict enough that it is not worth finding out per browser.

    Drawn as strokes on a 24x24 grid with currentColor, so each one takes its
    module's own colour from --fc rather than being twelve fixed pictures. They
    replace emoji, which rendered at different weights and colours on every
    platform and read as decoration rather than as a set.
  -->
  <defs>
    <g id="ic-base" fill="none" stroke="currentColor" stroke-width="1.7"
       stroke-linecap="round" stroke-linejoin="round"/>
  </defs>

  <symbol id="i-expenses" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H18a3 3 0 0 1 3 3v9a3 3 0 0 1-3 3H6a3 3 0 0 1-3-3Z"/>
    <path d="M3 8h15"/><circle cx="17" cy="14" r="1.4"/>
  </symbol>

  <symbol id="i-photos" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2.5"/>
    <circle cx="8.5" cy="10" r="1.6"/>
    <path d="M3.5 17.5 9 12.5l3.5 3 3-2.5 5 4.5"/>
  </symbol>

  <symbol id="i-vault" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="4" y="10" width="16" height="10.5" rx="2.5"/>
    <path d="M7.5 10V7.5a4.5 4.5 0 0 1 9 0V10"/>
    <circle cx="12" cy="15" r="1.4"/><path d="M12 16.4v1.6"/>
  </symbol>

  <symbol id="i-loans" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 9.5 12 4.5l8.5 5"/><path d="M4.5 9.5v9"/><path d="M19.5 9.5v9"/>
    <path d="M8.5 12v4"/><path d="M12 12v4"/><path d="M15.5 12v4"/><path d="M3 19.5h18"/>
  </symbol>

  <symbol id="i-cards" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5.5" width="19" height="13" rx="2.5"/>
    <path d="M2.5 10h19"/><path d="M6 14.5h3.5"/>
  </symbol>

  <symbol id="i-documents" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 3H7a2.5 2.5 0 0 0-2.5 2.5v13A2.5 2.5 0 0 0 7 21h10a2.5 2.5 0 0 0 2.5-2.5V8.5Z"/>
    <path d="M14 3v5.5h5.5"/><path d="M8.5 13h7"/><path d="M8.5 16.5h5"/>
  </symbol>

  <symbol id="i-insurance" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.2 4.8 6.2v5.4c0 4.4 3 7.9 7.2 9.2 4.2-1.3 7.2-4.8 7.2-9.2V6.2Z"/>
    <path d="m9.2 12.2 2 2.1 3.6-4"/>
  </symbol>

  <symbol id="i-investments" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 19.5h17"/><path d="m4.5 15.5 4.5-5 3.5 3 6.5-7.5"/>
    <path d="M14.5 6h4.5v4.5"/>
  </symbol>

  <symbol id="i-reminders" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 9.5a6 6 0 0 0-12 0c0 5-2 6.5-2 6.5h16s-2-1.5-2-6.5Z"/>
    <path d="M13.7 19.5a2 2 0 0 1-3.4 0"/>
  </symbol>

  <symbol id="i-todos" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="m3.5 7 2 2 3-3.5"/><path d="M11 7.5h9.5"/>
    <path d="m3.5 13.5 2 2 3-3.5"/><path d="M11 14h9.5"/>
    <path d="M3.5 19.5h2"/><path d="M11 20h9.5"/>
  </symbol>

  <symbol id="i-habits" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/>
    <path d="M3.5 9.5h17"/><path d="M8 3.5V6"/><path d="M16 3.5V6"/>
    <path d="m9 15 1.8 1.8L15 13"/>
  </symbol>

  <symbol id="i-notes" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19.5 12.5v6A2.5 2.5 0 0 1 17 21H6.5A2.5 2.5 0 0 1 4 18.5V8A2.5 2.5 0 0 1 6.5 5.5h6"/>
    <path d="M16.2 3.8a1.9 1.9 0 0 1 2.7 2.7L12.6 12.8l-3.3.7.7-3.3Z"/>
  </symbol>
</svg>
