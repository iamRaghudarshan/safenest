<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="SafeNest">
  <!-- The SafeNest mark: a hexagonal shell, a solid cube inside it, and a sweep
       curving beneath. Rebuilt as vector rather than traced from a raster so it
       stays sharp at 24px in the nav and at 512px as an app icon.
       The sweep is drawn FIRST, so the shell sits over it and the two read as
       separate shapes — drawn last it merged into the hexagon and the whole mark
       turned into a blob at small sizes. -->
  <defs>
    <linearGradient id="sn-shell" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="1" stop-color="#0B4FD0"/>
    </linearGradient>
    <linearGradient id="sn-top" x1="0.1" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#4C97FF"/>
      <stop offset="1" stop-color="#1F6AE8"/>
    </linearGradient>
    <linearGradient id="sn-left" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1F63DE"/>
      <stop offset="1" stop-color="#123F9E"/>
    </linearGradient>
    <linearGradient id="sn-right" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25397F"/>
      <stop offset="1" stop-color="#16265C"/>
    </linearGradient>
    <linearGradient id="sn-sweep" x1="0" y1="0" x2="1" y2="0.7">
      <stop offset="0" stop-color="#2E7BF6"/>
      <stop offset="1" stop-color="#0B4FD0"/>
    </linearGradient>
  </defs>

  <!-- sweep, behind everything -->
  <path d="M20 44 C10 85 45 111 85 102 C96 99.6 103 94.5 107 88.5
           C97 97.5 81 101.5 65 98.5 C38 93.4 22 74 20 44 Z"
        fill="url(#sn-sweep)"/>

  <!-- shell: flat-topped hexagon with softened corners -->
  <path d="M46.5 15 H77.5 A6 6 0 0 1 82.7 18 L98.2 44 A6 6 0 0 1 98.2 50
           L82.7 76 A6 6 0 0 1 77.5 79 H46.5 A6 6 0 0 1 41.3 76 L25.8 50
           A6 6 0 0 1 25.8 44 L41.3 18 A6 6 0 0 1 46.5 15 Z"
        fill="none" stroke="url(#sn-shell)" stroke-width="7" stroke-linejoin="round"/>

  <!-- cube -->
  <path d="M62 27 L80.5 37.5 L62 48 L43.5 37.5 Z" fill="url(#sn-top)"/>
  <path d="M43.5 37.5 L62 48 L62 69 L43.5 58.5 Z" fill="url(#sn-left)"/>
  <path d="M80.5 37.5 L62 48 L62 69 L80.5 58.5 Z" fill="url(#sn-right)"/>
</svg>
