<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="SafeNest">
  <!-- The SafeNest mark, rebuilt as vector.
       Three parts, and the relationship between them is what makes it read:
       a hexagonal shell, a SOLID cube filling most of it, and a crescent that
       WRAPS the shell from the upper-left, round the bottom, to a point at the
       lower-right. An earlier attempt had the cube too small and the crescent
       sitting underneath rather than embracing — which loses the whole gesture. -->
  <defs>
    <linearGradient id="sn-shell" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="0.55" stop-color="#1877F2"/>
      <stop offset="1" stop-color="#0B4FD0"/>
    </linearGradient>
    <linearGradient id="sn-top" x1="0.2" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#4E9AFF"/>
      <stop offset="1" stop-color="#2179EE"/>
    </linearGradient>
    <linearGradient id="sn-left" x1="0" y1="0.1" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2472E8"/>
      <stop offset="1" stop-color="#1348AE"/>
    </linearGradient>
    <linearGradient id="sn-right" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#1E3A86"/>
      <stop offset="1" stop-color="#15265C"/>
    </linearGradient>
    <linearGradient id="sn-sweep" x1="0" y1="0.1" x2="1" y2="0.9">
      <stop offset="0" stop-color="#3D8BFF"/>
      <stop offset="0.6" stop-color="#1877F2"/>
      <stop offset="1" stop-color="#0B4FD0"/>
    </linearGradient>
  </defs>

  <!-- The crescent, behind the shell so the two stay legible as separate shapes.
       Tapered to nothing at both tips: thick through the bottom-left, a point at
       the lower-right. -->
  <path d="M12.6 40.5
           C7 62 11 84 26 98
           C44 114.5 74 111 99.5 91.5
           C80 103 57 103.5 42 95
           C26 86 17.5 66 19.5 44.5 Z"
        fill="url(#sn-sweep)"/>

  <!-- Shell: flat-topped hexagon, rounded corners, open stroke. -->
  <path d="M46 18 H78 A7 7 0 0 1 84.1 21.5 L100.1 49 A7 7 0 0 1 100.1 56
           L84.1 83.5 A7 7 0 0 1 78 87 H46 A7 7 0 0 1 39.9 83.5 L23.9 56
           A7 7 0 0 1 23.9 49 L39.9 21.5 A7 7 0 0 1 46 18 Z"
        fill="none" stroke="url(#sn-shell)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Cube, filling roughly two thirds of the shell's width. -->
  <path d="M62 27 L85 40.5 L62 54 L39 40.5 Z" fill="url(#sn-top)"/>
  <path d="M39 40.5 L62 54 L62 79 L39 65.5 Z" fill="url(#sn-left)"/>
  <path d="M85 40.5 L62 54 L62 79 L85 65.5 Z" fill="url(#sn-right)"/>
</svg>
