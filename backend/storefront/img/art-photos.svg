<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" width="760" height="580" role="img" aria-label="Receipts and documents being photographed and filed">
  <!-- Same flat idiom and palette as hero-home.svg: one soft blob, flat
       solids, hairline card edges, and the sparkle motif. Says what the
       section says without showing the application. -->
  <defs>
    <linearGradient id="gp" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF4FE"/><stop offset="1" stop-color="#DFEAFD"/>
    </linearGradient>
  </defs>
  <path fill="url(#gp)" d="M400 44 C575 44 706 152 690 306 C674 456 542 534 384 532 C226 530 76 462 68 306 C60 150 225 44 400 44 Z"/>
  <ellipse cx="380" cy="488" rx="214" ry="24" fill="#CFDEFA" opacity=".75"/>

  <!-- a fanned stack of the paperwork a household photographs -->
  <g transform="rotate(-13 300 300)">
    <rect x="176" y="170" width="206" height="268" rx="16" fill="#FFFFFF" stroke="#DCE7FC" stroke-width="3"/>
    <rect x="200" y="198" width="92" height="10" rx="5" fill="#3fa96e"/>
    <rect x="200" y="222" width="146" height="8" rx="4" fill="#E9EFFA"/>
