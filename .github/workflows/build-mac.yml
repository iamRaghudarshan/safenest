# Compile the Mac build without owning a Mac.
#
# PyInstaller freezes the interpreter it runs under, so a macOS executable can
# only be produced on macOS. This runs the ordinary build on GitHub's macOS
# runners and hands back the finished folder as an artifact; you download it,
# drop it into dist-app/mac/, and issue Mac copies from your own laptop like any
# other. The source, the licences and the signing key never leave your machine —
# this job only compiles.
#
# WHAT IT DOES NOT NEED
# No secrets. The licence signing key is not used to build the app; it is used to
# sign licences and release manifests, which happens on your own installation.
# Do not add it here.
#
# Trigger it from the Actions tab (workflow_dispatch), or push a tag.
name: Build the Mac app

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  mac:
    runs-on: macos-14        # Apple silicon; use macos-13 for an Intel build
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Install the backend's dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Build-time only, and deliberately not in requirements.txt: that file
          # is installed on customers' machines by setup.py.
          pip install pyinstaller nuitka

      - name: Compile
        run: python packaging/build_exe.py --native --no-models --clean

      - name: Check it actually produced something
        run: |
          test -d "dist-app/mac/FinMate.app" || {
            echo "::error::No .app bundle was produced"; ls -la dist-app/mac; exit 1; }
          test -x "dist-app/mac/FinMate.app/Contents/MacOS/FinMate" || {
            echo "::error::The .app has no executable inside it"; exit 1; }
          file "dist-app/mac/FinMate.app/Contents/MacOS/FinMate"

      # Tarred HERE, on the Mac, and never unpacked until it reaches another Mac.
      #
      # Python.framework is built from symlinks — Python -> Versions/Current/Python,
      # Versions/Current -> 3.13 — and macOS seals that structure into the code
      # signature. Anything that turns those links into copies invalidates it, and
      # the app dies with "code signature not valid for use in process". Both a zip
      # artifact and a Windows file copy do exactly that, silently.
      #
      # tar records a symlink as a symlink. The bundler then copies entries from
      # this archive straight into the customer's, without ever materialising them
      # on a filesystem that cannot represent them.
      # Ad-hoc signing: no Apple account, no cost. It does NOT stop Gatekeeper
      # asking -- only notarisation does that -- but it replaces the worst of the
      # refusals. An unsigned binary on Apple silicon is reported as "damaged" and
      # offered only "Move to Bin", which reads as a corrupt download rather than
      # a policy decision, and customers bin it. Signed ad-hoc, the same app gets
      # the ordinary "unidentified developer" prompt, which has an Open button.
      - name: Sign ad-hoc
        run: |
          cd dist-app/mac
          # --deep signs the nested binaries first and the bundle last. Deprecated
          # by Apple for real signing identities, but it is the correct tool for an
          # ad-hoc pass over a PyInstaller tree of a few hundred dylibs.
          codesign --force --deep --timestamp=none --sign - FinMate.app
          echo "signature:"
          codesign -dv FinMate.app 2>&1 | head -5
          codesign --verify --deep --strict FinMate.app && echo "verifies" || \
            echo "::warning::ad-hoc signature did not verify strictly"

      - name: Pack, preserving symlinks
        run: |
          cd dist-app/mac
          tar -czf ../../mac-app.tar.gz FinMate.app
          cd ../..
          links=$(tar -tvzf mac-app.tar.gz | grep -c '^l' || true)
          echo "symlinks in the archive: $links"
          # A hard failure, not a note. Zero means something dereferenced them,
          # and the build only fails later — on the customer's Mac, with
          # "library load disallowed by system policy" and no clue why.
          if [ "$links" -lt 1 ]; then
            echo "::error::Python.framework's symlinks were flattened. macOS will"
            echo "::error::refuse to load the library. Not shipping this."
            tar -tvzf mac-app.tar.gz | grep -i 'Python.framework' | head -20
            exit 1
          fi
          ls -lh mac-app.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: mac-app.tar.gz
          # A few hundred megabytes; long enough to download, short enough not to
          # sit in the account for months.
          retention-days: 14
          compression-level: 6
