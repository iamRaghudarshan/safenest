# Compile the Mac build without owning a Mac.
#
# PyInstaller freezes the interpreter it runs under, so a macOS executable can
# only be produced on macOS. This runs the ordinary build on GitHub's macOS
# runners and hands back the finished folder as an artifact; you download it,
# drop it into dist-app/mac/, and issue Mac copies from your own laptop like any
# other. The source, the licences and the signing key never leave your machine —
# this job only compiles.
#
# WHAT IT DOES NOT NEED
# No secrets. The licence signing key is not used to build the app; it is used to
# sign licences and release manifests, which happens on your own installation.
# Do not add it here.
#
# Trigger it from the Actions tab (workflow_dispatch) at any time.
#
# It also starts itself whenever VERSION changes, which is the only moment a Mac
# build is definitely needed. An ordinary commit does not warrant a 20-minute
# macOS runner, but relying on remembering to press the button meant a release
# went out with the Windows half on the new version and the Mac half silently on
# the old one -- and nothing anywhere says so until it reaches a customer.
name: Build the Mac app

on:
  workflow_dispatch:
  push:
    branches: [main]
    # This file too, not only VERSION. A change to the Mac build is exactly the
    # thing that should prove itself, and the alternative is workflow_dispatch —
    # which needs an Actions:write token this project deliberately does not keep,
    # so with push access alone a broken Mac build could not even be retried.
    paths: ['VERSION', '.github/workflows/build-mac.yml']

jobs:
  mac:
    # macos-latest, NOT a pinned image. `macos-14` stopped being provided, and
    # the failure gives you nothing to go on: the job ends in five seconds with
    # no runner assigned, no steps, and no log to read — it never started. The
    # Mac half then sat silently on 3.1 while Windows shipped 3.2, which is the
    # precise failure the VERSION trigger above was added to prevent.
    #
    # Pinning bought reproducibility we were not using and cost the build the
    # moment the image was retired. The phone app's iOS job has always said
    # macos-latest and kept working through the same retirement.
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Install the backend's dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Build-time only, and deliberately not in requirements.txt: that file
          # is installed on customers' machines by setup.py.
          pip install pyinstaller nuitka

      - name: Compile
        run: python packaging/build_exe.py --native --no-models --clean

      - name: Check it actually produced something
        run: |
          test -d "dist-app/mac/App.app" || {
            echo "::error::No .app bundle was produced"; ls -la dist-app/mac; exit 1; }
          test -x "dist-app/mac/App.app/Contents/MacOS/App" || {
            echo "::error::The .app has no executable inside it"; exit 1; }
          file "dist-app/mac/App.app/Contents/MacOS/App"

      # Tarred HERE, on the Mac, and never unpacked until it reaches another Mac.
      #
      # Python.framework is built from symlinks — Python -> Versions/Current/Python,
      # Versions/Current -> 3.13 — and macOS seals that structure into the code
      # signature. Anything that turns those links into copies invalidates it, and
      # the app dies with "code signature not valid for use in process". Both a zip
      # artifact and a Windows file copy do exactly that, silently.
      #
      # tar records a symlink as a symlink. The bundler then copies entries from
      # this archive straight into the customer's, without ever materialising them
      # on a filesystem that cannot represent them.
      # Ad-hoc signing: no Apple account, no cost. It does NOT stop Gatekeeper
      # asking -- only notarisation does that -- but it replaces the worst of the
      # refusals. An unsigned binary on Apple silicon is reported as "damaged" and
      # offered only "Move to Bin", which reads as a corrupt download rather than
      # a policy decision, and customers bin it. Signed ad-hoc, the same app gets
      # the ordinary "unidentified developer" prompt, which has an Open button.
      # THE REAL FIX FOR "damaged / cannot be opened": Developer ID + notarisation.
      # Ad-hoc signing (below) only downgrades the wording; on recent macOS a
      # browser-downloaded ad-hoc app is still quarantined and refused, and the
      # install .command is refused too. The website works around this with a
      # curl one-liner (curl-fetched files are not quarantined) — see
      # storefront.install_mac_script — but the credible fix is notarisation:
      # then a plain double-click works and no workaround is needed.
      #
      # TO ENABLE (needs an Apple Developer account, $99/yr). Add repo secrets:
      #   MAC_CERT_P12         base64 of the "Developer ID Application" .p12
      #   MAC_CERT_PASSWORD    its password
      #   MAC_SIGN_IDENTITY    e.g. "Developer ID Application: NAME (TEAMID)"
      #   MAC_NOTARY_APPLE_ID  Apple ID email
      #   MAC_NOTARY_TEAM_ID   the 10-char team id
      #   MAC_NOTARY_PASSWORD  an app-specific password for that Apple ID
      # then: import the cert into a temp keychain, sign with --options runtime
      # (hardened runtime is REQUIRED), `xcrun notarytool submit --wait`, and
      # `xcrun stapler staple App.app` — BEFORE the "Pack" step.
      #
      # CAVEAT to reconcile when enabling: bundler._mac_from_tar renames App.app ->
      # <Brand>.app and edits Info.plist, which INVALIDATES a Developer ID signature
      # (and the staple). So notarisation must sign the app in its FINAL branded
      # form — either bake the brand name here before signing and make the bundler
      # skip its rename/plist edit, or re-sign+re-notarise after the rename. Do NOT
      # ship a renamed copy of a notarised bundle; it reads as tampered.
      - name: Sign ad-hoc
        run: |
          cd dist-app/mac
          # --deep signs the nested binaries first and the bundle last. Deprecated
          # by Apple for real signing identities, but it is the correct tool for an
          # ad-hoc pass over a PyInstaller tree of a few hundred dylibs.
          codesign --force --deep --timestamp=none --sign - App.app
          echo "signature:"
          codesign -dv App.app 2>&1 | head -5
          codesign --verify --deep --strict App.app && echo "verifies" || \
            echo "::warning::ad-hoc signature did not verify strictly"

      - name: Pack, preserving symlinks
        run: |
          cd dist-app/mac
          tar -czf ../../mac-app.tar.gz App.app
          cd ../..
          links=$(tar -tvzf mac-app.tar.gz | grep -c '^l' || true)
          echo "symlinks in the archive: $links"
          # A hard failure, not a note. Zero means something dereferenced them,
          # and the build only fails later — on the customer's Mac, with
          # "library load disallowed by system policy" and no clue why.
          if [ "$links" -lt 1 ]; then
            echo "::error::Python.framework's symlinks were flattened. macOS will"
            echo "::error::refuse to load the library. Not shipping this."
            tar -tvzf mac-app.tar.gz | grep -i 'Python.framework' | head -20
            exit 1
          fi
          ls -lh mac-app.tar.gz

      # The other half of the same guarantee, and the half that only a Mac can
      # answer. Packing keeps the symlinks; this checks the customer's copy can
      # UNPACK them when it installs an update. Windows cannot even create a
      # symlink without a privilege the build process does not have, so this is
      # untestable there -- and an update that flattens Python.framework on the
      # way in is as dead as one that flattened it on the way out.
      - name: An update of this archive unpacks with its symlinks intact
        run: |
          python3 - <<'PY'
          import sys, tarfile
          from pathlib import Path
          sys.path.insert(0, "backend")
          from app import updates

          out = Path("update-unpack-test")
          root = updates.unpack(Path("mac-app.tar.gz"), out)
          links = [p for p in out.rglob("*") if p.is_symlink()]
          print(f"unpacked {root.name}: {len(links)} symlinks restored")
          if not links:
              raise SystemExit("::error::unpack() flattened the symlinks. A Mac "
                               "customer installing this update would get an app "
                               "macOS refuses to load.")
          fw = list(out.rglob("Python.framework/Python"))
          if not fw or not fw[0].is_symlink():
              raise SystemExit("::error::Python.framework/Python came back as a "
                               "real file instead of a link.")
          print("Python.framework/Python ->", fw[0].readlink())
          PY
          rm -rf update-unpack-test

      # One release reaches every Mac customer, so the bundle inside it carries
      # the build's name and not theirs. The swap script puts the customer's own
      # name back and re-signs -- which is the part only a Mac can answer, because
      # editing inside a bundle breaks its signature and a broken signature means
      # the interpreter will not load.
      - name: A renamed, re-signed bundle still launches
        run: |
          set -e
          rm -rf renametest && mkdir renametest
          ditto dist-app/mac/App.app "renametest/TheirName.app"
          APP="$PWD/renametest/TheirName.app"
          PL="$APP/Contents/Info.plist"
          # What the swap script does: put the customer's own name back into the
          # bundle the release shipped, then re-sign. Editing inside a bundle
          # breaks its signature, and on macOS a broken signature means the
          # interpreter will not load -- which no static check can see.
          for k in CFBundleName CFBundleDisplayName; do
            /usr/libexec/PlistBuddy -c "Set :$k TheirName" "$PL"
          done
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"             || { echo "::error::the re-signed bundle does not verify"; exit 1; }
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$PL")
          echo "name now TheirName, executable still $EXE"
          "$APP/Contents/MacOS/$EXE" --version >/dev/null 2>&1 &
          PID=$!
          sleep 25
          if kill -0 $PID 2>/dev/null; then
            echo "it launched and stayed up"
            kill $PID 2>/dev/null || true
          else
            wait $PID || true
            echo "::error::the re-signed app did not stay running"
            exit 1
          fi
          rm -rf renametest

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: mac-app.tar.gz
          # A few hundred megabytes; long enough to download, short enough not to
          # sit in the account for months.
          retention-days: 14
          compression-level: 6
